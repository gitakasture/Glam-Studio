<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register — Varsha Pawar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#fdf8f8;--white:#ffffff;--pink:#e8a0b4;--pink-deep:#c96b8a;--pink-pale:#fce8ef;--text:#1a0d12;--muted:#8a6070;--border:#f0d0da;--accent:#d4547a;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);cursor:none;min-height:100vh;display:flex;flex-direction:column;}
.cursor{position:fixed;width:8px;height:8px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid var(--pink);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s;}
.cursor-ring.expand{width:48px;height:48px;opacity:.5;}
nav{display:flex;align-items:center;justify-content:space-between;padding:24px 60px;background:rgba(253,248,248,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;letter-spacing:3px;text-transform:uppercase;}
.logo span{color:var(--accent);font-style:italic;}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;}
.card{background:var(--white);border:1px solid var(--border);padding:56px 48px;width:100%;max-width:440px;}
.section-label{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--pink-deep);margin-bottom:12px;display:block;}
.card h2{font-family:'Playfair Display',serif;font-size:36px;font-weight:300;margin-bottom:8px;}
.card h2 em{font-style:italic;color:var(--accent);}
.card p{font-size:13px;color:var(--muted);font-weight:300;margin-bottom:28px;}
.fg{margin-bottom:20px;}
.fg label{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.fg input{width:100%;padding:13px 16px;border:1px solid var(--border);background:var(--bg);font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:var(--text);outline:none;transition:border-color .2s;}
.fg input:focus{border-color:var(--pink-deep);}
.btn{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:none;transition:.2s;margin-top:8px;}
.btn:hover{background:var(--pink-deep);}
.links{display:flex;justify-content:space-between;margin-top:20px;}
.links a{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-decoration:none;cursor:none;transition:color .2s;}
.links a:hover{color:var(--accent);}
.error-msg{display:none;background:#fce8ef;border:1px solid var(--border);padding:12px 16px;font-size:12px;color:var(--pink-deep);margin-bottom:20px;text-align:center;}
.success-msg{display:none;background:#e8f5e9;border:1px solid #c8e6c9;padding:12px 16px;font-size:12px;color:#2e7d32;margin-bottom:20px;text-align:center;}
footer{background:var(--text);color:rgba(255,255,255,.5);padding:32px 60px;display:flex;justify-content:space-between;align-items:center;}
footer .logo{color:rgba(255,255,255,.8);}
footer p{font-size:12px;}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="cur-ring"></div>
<nav><div class="logo">Varsha <span>Pawar</span></div></nav>
<div class="wrap">
  <div class="card">
    <span class="section-label">Create Account</span>
    <h2>Regis<em>ter</em></h2>
    <p>Sign up to book your appointment with Varsha.</p>
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg">Account created! Redirecting to login...</div>
    <div class="fg"><label>Full Name</label><input type="text" id="r-name" placeholder="Priya Sharma"/></div>
    <div class="fg"><label>Email</label><input type="email" id="r-email" placeholder="you@email.com"/></div>
    <div class="fg"><label>Phone</label><input type="text" id="r-phone" placeholder="+91 98765 43210"/></div>
    <div class="fg"><label>Password</label><input type="password" id="r-pass" placeholder="••••••••"/></div>
    <button class="btn" onclick="doRegister()">Create Account</button>
    <div class="links">
      <a href="login.html">Already have account? Login</a>
      <a href="index.html">← Back to site</a>
    </div>
  </div>
</div>
<footer>
  <div class="logo">Varsha <span>Pawar</span></div>
  <p>© 2026 Varsha Pawar. All rights reserved.</p>
</footer>
<script>
const cur = document.getElementById('cur');
const ring = document.getElementById('cur-ring');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px';
  ring.style.left = e.clientX+'px'; ring.style.top = e.clientY+'px';
});
document.querySelectorAll('button,a,input').forEach(el => {
  el.addEventListener('mouseenter', () => ring.classList.add('expand'));
  el.addEventListener('mouseleave', () => ring.classList.remove('expand'));
});

async function doRegister() {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const phone = document.getElementById('r-phone').value.trim();
  const pass = document.getElementById('r-pass').value.trim();
  const err = document.getElementById('error-msg');
  const suc = document.getElementById('success-msg');
  if (!name || !email || !pass) { err.style.display='block'; err.textContent='Please fill all required fields.'; return; }
  try {
    const res = await fetch('/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, phone, password: pass })
    });
    const data = await res.json();
    if (data.success) {
      err.style.display='none';
      suc.style.display='block';
      setTimeout(() => window.location.href='login.html', 2000);
    } else {
      err.style.display='block'; err.textContent = data.error || 'Email already exists.';
    }
  } catch(e) {
    err.style.display='block'; err.textContent='Could not connect to server.';
  }
}
</script>
</body>
</html>
